name: Build Windows

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    env:
      # Traktor lives in traktor\ inside the workspace: its sources at the commit of the
      # Traktor build used, with that build's binaries on top. Set for the whole job, since
      # generating the projects bakes it into them as absolute paths, and the asset build
      # resolves the workspace's Runtime.SystemRoot ($(TRAKTOR_HOME)) through it.
      TRAKTOR_HOME: ${{ github.workspace }}\traktor
    steps:
    - uses: actions/checkout@v3

    - name: Install Blender
      uses: bradyajohnston/setup-blender@v5
      with:
        version: '5.2'

    - name: Find Traktor build
      id: traktor
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Runs are listed unfiltered and filtered here, since GitHub's branch/status filters
        # return stale runs for the Traktor repository (a build weeks old as the newest one).
        $headers = @{ Authorization = "Bearer $env:GH_TOKEN" }
        $runs = (Invoke-RestMethod -Headers $headers "https://api.github.com/repos/apistol78/traktor/actions/workflows/build-windows.yml/runs?per_page=100").workflow_runs
        $run = $runs | Where-Object { $_.head_branch -eq 'master' -and $_.event -eq 'push' -and $_.conclusion -eq 'success' } | Select-Object -First 1
        if (-not $run) { throw 'No successful Traktor master build found.' }
        Write-Host "Using Traktor build $($run.html_url) (commit $($run.head_sha), $($run.created_at))"
        "run=$($run.id)" >> $env:GITHUB_OUTPUT
        "sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT

    # Only what building Zombie's C++ needs: the headers, the solution and its configurations,
    # config.bat and the solution builder. The build adds the rest.
    - name: Check out Traktor
      uses: actions/checkout@v4
      with:
        repository: apistol78/traktor
        ref: ${{ steps.traktor.outputs.sha }}
        path: traktor
        sparse-checkout: |
          code
          resources/build
          scripts
          bin/win64

    - name: Download Traktor
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh run download ${{ steps.traktor.outputs.run }} --repo apistol78/traktor --name traktor --dir traktor-build
        robocopy traktor-build traktor /E /NFL /NDL /NJH /NJS /NP
        if ($LASTEXITCODE -ge 8) { throw "Copying the Traktor build failed ($LASTEXITCODE)." }
        exit 0

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    # Before the assets: their pipeline loads Zombie.Editor, and the game Zombie.
    - name: Build code
      shell: cmd
      run: scripts\autobuild-code-win64.bat

    - name: Build
      run: ./scripts/autobuild-win64.bat

    - name: Install NSIS
      uses: repolevedavaj/install-nsis@v1
      with:
        nsis-version: '3.12'

    - name: Print NSIS version
      run: makensis -VERSION

    - name: Installer
      uses: joncloud/makensis-action@v4.1
      with:
        script-file: ./scripts/installer.nsi

    - name: Archive
      uses: actions/upload-artifact@v4
      with:
        name: Installer
        path: 'Zombie Setup.exe'
